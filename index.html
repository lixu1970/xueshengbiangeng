  /* inline string 子标签必须与工作表使用同一 XML 命名空间；否则 WPS/Excel 会把写入内容当成空值 */
  const body=`<${prefix}is><${prefix}t xml:space="preserve">${xmlEsc(newText)}</${prefix}t></${prefix}is>`;
  const ctag=prefix+"c",rtag=prefix+"row",sheetDataClose=`</${prefix}sheetData>`;
  /* 支持 artifact_tool/WPS 生成的 x:c / x:row 命名空间标签 */
  let re=new RegExp(`<${ctag}([^>]*\\br="${safeRef}"[^>]*)\\s*\\/>`);
  if(re.test(xml)) return xml.replace(re,(all,attrs)=>{
    attrs=attrs.replace(/\s+t="[^"]*"/g,"");
    return `<${ctag}${attrs} t="inlineStr">${body}</${ctag}>`;
  });
  re=new RegExp(`<${ctag}([^>]*\\br="${safeRef}"[^>]*)>([\\s\\S]*?)<\\/${ctag}>`);
  if(re.test(xml)) return xml.replace(re,(all,attrs)=>{
    attrs=attrs.replace(/\s+t="[^"]*"/g,"");
    return `<${ctag}${attrs} t="inlineStr">${body}</${ctag}>`;
  });
  const rn=rowNumber(ref);
  if(!rn) return xml;
  const rowRe=new RegExp(`(<${rtag}\\b[^>]*\\br="${rn}"[^>]*>)([\\s\\S]*?)(<\\/${rtag}>)`);
  if(rowRe.test(xml)){
    return xml.replace(rowRe,(all,open,inside,close)=>`${open}${inside}<${ctag} r="${ref}" t="inlineStr">${body}</${ctag}>${close}`);
  }
  const newRow=`<${rtag} r="${rn}"><${ctag} r="${ref}" t="inlineStr">${body}</${ctag}></${rtag}>`;
  return xml.replace(sheetDataClose,newRow+sheetDataClose);
}
function getSheetXmlPath(sheet){
  const target=s(sheet).trim();
  for(const [name,path] of Object.entries(SHEET_XML_MAP)) if(s(name).trim()===target)return path;
  return null;
}
function excelCol(n){let v='';for(;n;n=Math.floor((n-1)/26))v=String.fromCharCode(65+(n-1)%26)+v;return v}
function buildLatestXlsxBytes(){
 const dec=new TextDecoder(),enc=new TextEncoder();
 const files=ORIGINAL_PACKAGE.map(f=>({name:f.name,data:b64ToBytes(f.b64)}));
 const byName=new Map(files.map(f=>[f.name,f]));let applied=0;
 const path=getSheetXmlPath('学生表'),f=byName.get(path);
 if(!f)throw new Error('找不到原始学生表');
 let xml=dec.decode(f.data);
 for(const p of PEOPLE){
  const entries=parseEntries(memoText(p));
  entries.forEach((e,i)=>{
   const ref=excelCol(5+i)+p.row;
   const val=`[${e.date}] [${({red:'红',yellow:'黄',green:'绿',white:'白'})[e.color]||'白'}] ${e.text}`;
   xml=patchCellXml(xml,ref,val);
   const sty=COLOR_STYLE[e.color]??COLOR_STYLE.white;
   const re=new RegExp('(<c\\b[^>]*\\br="'+ref+'"[^>]*)(>)');
   xml=xml.replace(re,(whole,attrs,end)=>attrs.replace(/\s+s="[^"]*"/g,'')+' s="'+sty+'"'+end);
   applied++;
  });
 }
 const d=new Date();const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
 xml=patchCellXml(xml,'A1','学生入校期间晨午检考勤日报台账｜备忘更新下载时间：'+stamp);
 f.data=enc.encode(xml);
 return {bytes:zipStore(files),applied,stamp};
}

async function downloadLatestExcel(){try{EDITS=loadEdits();const result=buildLatestXlsxBytes();const blob=new Blob([result.bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='沙河学生表_备忘更新_'+result.stamp.replace(/[- :]/g,'')+'.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);setStatus(`已生成 Excel：${result.applied} 条备忘按 E、F、G… 列分别写入；表头已标下载时间`)}catch(e){alert('导出失败：'+e.message);setStatus('下载失败',true)}}
document.getElementById('view').onclick=doView;document.getElementById('download').onclick=downloadLatestExcel;document.getElementById('clear').onclick=clearAll;document.getElementById('classPick').onchange=()=>{if(document.getElementById('classPick').value){document.getElementById('q').value='';selectedPersonRow=null;}else selectedPersonRow=null;suggest.hidden=true;doView()};const qInput=document.getElementById('q'),suggest=document.getElementById('suggest');
qInput.addEventListener('input',()=>{if(qInput.value.trim()){document.getElementById('classPick').value='';selectedPersonRow=null;}
 const q=qInput.value.trim();suggest.innerHTML='';suggest.hidden=true;
 if([...q].length<2)return;
 const cls=document.getElementById('classPick').value;
 const matches=PEOPLE.filter(p=>p.name.includes(q)&&(!cls||p.className===cls));
 if(!matches.length)return;
 matches.forEach(p=>{let b=document.createElement('button');b.type='button';b.textContent=p.name+' · '+p.className;b.onclick=()=>{qInput.value=p.name;document.getElementById('classPick').value='';selectedPersonRow=p.row;suggest.hidden=true;doView();document.querySelector('.result')?.scrollIntoView({behavior:'smooth',block:'nearest'})};suggest.appendChild(b)});
 suggest.hidden=false;
});
qInput.onkeydown=e=>{if(e.key==='Enter'){suggest.hidden=true;doView()}};updateEditCount();
</script></body></html>
